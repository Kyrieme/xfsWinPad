name: ci

# Fast feedback CI: clean-runner Release build, full ctest suite, then the
# xfsbench data-path benchmark (results uploaded as an artifact).
# Release signing / installers live in build-and-sign.yml (dispatch + v* tags).

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_test_bench:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fast, dependency-free guards that run before the slow MSVC build.
      # The public repo may only contain code plus three .md files; private
      # notes/samples stay local and are excluded via .gitignore.
      - name: Public surface guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check-public-surface.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The sensitive word list is deliberately NOT stored in this repo, so the
      # scan materialises it from a repository secret for this step only.
      # Without the secret it skips itself (never fails the build).
      - name: Sensitive word scan
        shell: pwsh
        env:
          SENSITIVE_WORDS_B64: ${{ secrets.SENSITIVE_WORDS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SENSITIVE_WORDS_B64)) {
            Write-Host 'SENSITIVE_WORDS_B64 not configured - skipping content scan'
            exit 0
          }
          $wl = Join-Path $env:RUNNER_TEMP 'sensitive-words.txt'
          [IO.File]::WriteAllBytes($wl, [Convert]::FromBase64String($env:SENSITIVE_WORDS_B64))
          python scripts/check-sensitive-words.py --words $wl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (cmake)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instVer = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $major = [int]("$instVer".Split('.')[0])
          $gen = if ($major -ge 18) { 'Visual Studio 18 2026' } else { 'Visual Studio 17 2022' }
          Write-Host "Generator: $gen (VS $instVer)"
          cmake -S . -B build -G $gen -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          ctest -C Release --test-dir build --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Benchmark (xfsbench)
        shell: pwsh
        run: |
          & build\bin\Release\xfsbench.exe --csv --size-mb 32 | Tee-Object -FilePath benchmark.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content benchmark.csv | ForEach-Object { Write-Host $_ }

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          if-no-files-found: error
          path: benchmark.csv
